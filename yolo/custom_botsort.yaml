# custom_botsort.yaml
tracker_type: botsort # Tracker type
track_high_thresh: 0.4 # Threshold for the first tracking association
track_low_thresh: 0.1 # Threshold for the second tracking association
new_track_thresh: 0.6 # Threshold to create a new tracking ID
track_buffer: 150 # How many frames to remember a lost person (Increase this if nurses block patients often!)
match_thresh: 0.9 # Threshold for matching boxes
gmc_method: none # Global Motion Compensation (helps if camera shakes)
proximity_thresh: 0.4 # Bounding box overlap threshold
appearance_thresh: 0.25 # Threshold for visual appearance matching
with_reid: True # TURN ON RE-ID FEATURE
model: osnet_x0_25 # Tells YOLO to load the default Re-ID model
fuse_score: True